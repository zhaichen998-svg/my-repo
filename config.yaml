# Configuration for FSS Network Training

# Data
data:
  root: "./dataset/train"
  img_size: 400
  
# Model
model:
  pretrained: true
  
# Training
training:
  epochs: 150
  batch_size: 4
  iters_per_epoch: 500
  k_shot: 1
  
# Optimizer
optimizer:
  name: "AdamW"
  lr: 0.0001
  weight_decay: 0.0001
  
# Learning rate scheduler
scheduler:
  step_size: 50
  gamma: 0.5
  
# Validation
validation:
  frequency: 5  # Validate every N epochs
  
# Logging
logging:
  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"
  
# Hardware
hardware:
  num_workers: 4
  device: "cuda"  # or "cpu"
